name: Refresh GitHub profile visuals
on:
  workflow_dispatch:
  push:
    paths:
      - README.md
      - scripts/update_metrics.py
      - .github/workflows/refresh-profile.yml
  schedule:
    - cron: '19 3 * * *'
permissions:
  contents: write
concurrency:
  group: profile-visuals
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate profile visuals using public GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: jd2009-k
        run: python3 scripts/update_metrics.py
      - name: Commit refreshed SVG files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/*.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh verified profile visuals [skip ci]'
            git push
          fi
